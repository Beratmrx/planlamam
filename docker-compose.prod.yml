services:
  mysql:
    image: mysql:8.0
    container_name: planla-mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_turkish_ci
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-planla}
      MYSQL_USER: ${MYSQL_USER:-planla}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-planla123}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/mysql-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - planla-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: planla-backend
    restart: unless-stopped
    network_mode: host
    # VDS'te getaddrinfo EAI_AGAIN (graph.facebook.com) için: redirect takibi DNS kullanıyor; /etc/hosts ile IP'ye yönlendiriyoruz
    extra_hosts:
      - "graph.facebook.com:157.240.196.17"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
      - ./backend/.env
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3002
      - HOST=0.0.0.0
      - JSON_LIMIT=10mb
      - CORS_ORIGIN=${CORS_ORIGIN:-https://etkegym.com}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-planla_webhook_token_2024}
      - META_GRAPH_IP=${META_GRAPH_IP:-157.240.196.17}
      - MYSQL_HOST=127.0.0.1
      - MYSQL_PORT=3307
      - MYSQL_DATABASE=${MYSQL_DATABASE:-planla}
      - MYSQL_USER=${MYSQL_USER:-planla}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-planla123}
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3002/api/whatsapp/status', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:

networks:
  planla-network:
    driver: bridge
