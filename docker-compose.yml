services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: planla-backend
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - JSON_LIMIT=10mb
      - CORS_ORIGIN=http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1
      # WhatsApp Cloud API credentials
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_WEBHOOK_VERIFY_TOKEN=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-planla_webhook_token_2024}
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=planla
      - MYSQL_USER=planla
      - MYSQL_PASSWORD=planla123
    networks:
      - planla-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3002/api/whatsapp/status', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: http://backend:3002
    container_name: planla-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - VITE_BACKEND_URL=http://backend:3002
    depends_on:
      - backend
    networks:
      - planla-network

  mysql:
    image: mysql:8.0
    container_name: planla-mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: planla
      MYSQL_USER: planla
      MYSQL_PASSWORD: planla123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - planla-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:


networks:
  planla-network:
    driver: bridge
